<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disc Room console</title><style>html,body,#game{margin:0;width:100%;height:100%;background:#000;color:#d6dacd;font:14px Arial}#notice{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;pointer-events:none}.ejs_parent{width:100%!important;height:100%!important}</style></head><body><div id="game"></div><div id="notice"></div><script>
const hostOrigin=new URL(document.baseURI).origin;
const tell=(type,data={})=>parent.postMessage({discRoom:true,type,...data},hostOrigin);
const contexts=[],originalConnect=AudioNode.prototype.connect;
const BaseAudio=window.AudioContext||window.webkitAudioContext;
if(BaseAudio){window.AudioContext=class extends BaseAudio{constructor(...a){super(...a);this.discCapture=this.createMediaStreamDestination();contexts.push(this)}};window.webkitAudioContext=window.AudioContext;AudioNode.prototype.connect=function(target,...a){const result=originalConnect.call(this,target,...a);if(target===this.context.destination&&this.context.discCapture)originalConnect.call(this,this.context.discCapture);return result;};}
const mapping={0:{value:'x'},8:{value:'z'},1:{value:'a'},9:{value:'s'},10:{value:'q'},11:{value:'e'},12:{value:'1'},13:{value:'3'},2:{value:'shift'},3:{value:'enter'},4:{value:'up arrow'},5:{value:'down arrow'},6:{value:'left arrow'},7:{value:'right arrow'}};
for(const [index,button] of Object.entries({0:'BUTTON_1',8:'BUTTON_2',1:'BUTTON_3',9:'BUTTON_4',10:'LEFT_TOP_SHOULDER',11:'RIGHT_TOP_SHOULDER',12:'LEFT_BOTTOM_SHOULDER',13:'RIGHT_BOTTOM_SHOULDER',14:'LEFT_STICK',15:'RIGHT_STICK',2:'SELECT',3:'START',4:'DPAD_UP',5:'DPAD_DOWN',6:'DPAD_LEFT',7:'DPAD_RIGHT'}))mapping[index]={...mapping[index],value2:button};
for(const [index,key,axis] of [[16,'h','LEFT_STICK_X:+1'],[17,'f','LEFT_STICK_X:-1'],[18,'g','LEFT_STICK_Y:+1'],[19,'t','LEFT_STICK_Y:-1'],[20,'l','RIGHT_STICK_X:+1'],[21,'j','RIGHT_STICK_X:-1'],[22,'k','RIGHT_STICK_Y:+1'],[23,'i','RIGHT_STICK_Y:-1']])mapping[index]={value:key,value2:axis}; for(let i=24;i<30;i++)mapping[i]={value:'',value2:''}; let loaded=false,ready=false,inputTimer=0,remotePort=1;
function release(){if(window.EJS_emulator?.gameManager)for(let i=0;i<24;i++)EJS_emulator.gameManager.simulateInput(remotePort,i,0)}
window.discEngine={
 capture(){if(!ready)throw new Error('Start a game before connecting player two.');const canvas=EJS_emulator.canvas||EJS_emulator.frontend?.canvas;if(!canvas)throw new Error('Game video is not ready.');const stream=canvas.captureStream(60);for(const ctx of contexts)for(const track of ctx.discCapture.stream.getAudioTracks())stream.addTrack(track);if(!stream.getAudioTracks().length){for(const t of stream.getTracks())t.stop();throw new Error('Game audio is not ready. Click the game, then reconnect.');}return stream;},
 input(values){if(!ready||!Array.isArray(values)||values.length!==24||values.some(v=>typeof v!=='number'||!Number.isFinite(v)||Math.abs(v)>32767))return;clearTimeout(inputTimer);for(let i=0;i<24;i++){const v=Number(values[i]);if(!Number.isFinite(v)||Math.abs(v)>32767)return;EJS_emulator.gameManager.simulateInput(remotePort,i,v)}inputTimer=setTimeout(release,500);},
 release,
 pause(v){if(ready){EJS_emulator.paused=v;EJS_emulator.gameManager.toggleMainLoop(v?0:1)}},
 restart(){if(ready)EJS_emulator.gameManager.restart()},
 volume(v){if(ready){EJS_emulator.volume=v/100;EJS_emulator.setVolume(v/100)}},
 focus(){for(const c of contexts)c.resume();window.focus();(EJS_emulator?.canvas||EJS_emulator?.frontend?.canvas)?.focus()},
 exportState(){if(!ready)throw new Error('Start a game first.');if(EJS_emulator.getCore()==='bsnes'||!EJS_emulator.gameManager.supportsStates())throw new Error('Save states are unavailable in this core. Use another core to export states.');return EJS_emulator.gameManager.getState()},
 importState(bytes){if(ready&&EJS_emulator.getCore()!=='bsnes'&&EJS_emulator.gameManager.supportsStates())EJS_emulator.gameManager.loadState(new Uint8Array(bytes))}
};
window.addEventListener('message',e=>{if(e.origin!==hostOrigin||e.source!==parent||e.data?.type!=='boot'||loaded)return;loaded=true;const {file,bios,name,volume,core,system,label,threads,experimental}=e.data;remotePort=e.data.remotePort===0?0:1;window.EJS_player='#game';window.EJS_core=core||'pcsx_rearmed';window.EJS_gameUrl=file;window.EJS_gameName=name;window.EJS_gameID=(system||'ps1')+':'+(core||'pcsx_rearmed')+':'+name;window.EJS_biosUrl=bios?URL.createObjectURL(bios):'';window.EJS_pathtodata='/api/emulator/'+(experimental?'experimental':'stable')+'/';if(!experimental)window.EJS_paths={'loader.js':'/emulator/loader.js','emulator.min.js':'/emulator/emulator.min.js','emulator.min.css':'/emulator/emulator.min.css','extract7z.js':'/emulator/compression/extract7z.js','extractzip.js':'/emulator/compression/extractzip.js','unrar.js':'/emulator/compression/unrar.js'};window.EJS_color='#d94832';window.EJS_startOnLoaded=true;window.EJS_threads=!!threads;window.EJS_volume=volume/100;window.EJS_defaultControls={0:mapping,1:{},2:{},3:{}};if(core==='bsnes')window.EJS_Buttons={saveState:false,loadState:false,quickSave:false,quickLoad:false};window.EJS_CacheLimit=0;window.EJS_onGameStart=()=>{ready=true;document.getElementById('notice').textContent='';tell('started',{canSave:EJS_emulator.getCore()!=='bsnes'&&!!EJS_emulator.gameManager.supportsStates()});};window.EJS_ready=()=>{EJS_emulator.on('saveDatabaseLoaded',FS=>{if(!system||system==='ps1')return;const folder='/data/saves/'+system;FS.mkdirTree(folder);const path='/home/web_user/.config/retroarch/retroarch.cfg';const cfg=FS.readFile(path,{encoding:'utf8'});FS.writeFile(path,cfg.replace('savefile_directory = "/data/saves"','savefile_directory = "'+folder+'"'));});EJS_emulator.on('error',()=>tell('engine-error',{message:'The emulator could not start this game. Check the game files, firmware and selected core.'}));};document.getElementById('notice').textContent='Starting '+(label||'PlayStation')+'…';const script=document.createElement('script');script.src=experimental?'/api/emulator/experimental/loader.js':'/emulator/loader.js';script.onerror=()=>tell('engine-error',{message:'Unable to load the emulator. Reload and try again.'});document.head.appendChild(script);setTimeout(()=>{if(!ready)tell('engine-error',{message:'The game has not started. Check the BIOS and game files, or try a smaller image.'})},90000);});
window.addEventListener('error',e=>tell('engine-error',{message:e.message||'The emulator stopped unexpectedly.'}));
window.addEventListener('unhandledrejection',e=>tell('engine-error',{message:String(e.reason?.message||e.reason)}));
tell('engine-ready');
</script></body></html>
